<style>
/* Mflat : grands titres (Apple Music) + filtres et raccourcis (Spotify) + cartes groupées (LifeCasts). Grille 16px, vignettes 148px. */
:root{--bg:#f7f5f1;--card:#fff;--fill:#efebe4;--ink:#121214;--mut:#6e6e76;--line:rgba(0,0,0,.08);--acc:#B7790A;--accs:rgba(201,138,18,.14);--onacc:#fff;--glass:rgba(255,255,255,.78);--sh:0 6px 24px rgba(0,0,0,.10);--ph1:#e4e4ea;--ph2:#d4d4dc;--phi:#a3a3ad}
:root[data-theme="dark"],:root[data-theme="abstract"]{--bg:#100e0b;--card:#1c1915;--fill:#2a2620;--ink:#f6f2ea;--mut:#a39b8d;--line:rgba(255,255,255,.08);--acc:#F2B544;--accs:rgba(242,181,68,.16);--onacc:#1a1206;--glass:rgba(32,28,22,.78);--sh:0 8px 30px rgba(0,0,0,.5);--ph1:#2e2a24;--ph2:#221f1a;--phi:#6b6250;color-scheme:dark}
:root[data-theme="abstract"]{--bg:#0b0816;--card:rgba(255,255,255,.06);--fill:rgba(255,255,255,.09)}
:root[data-theme="abstract"] body{background:radial-gradient(40vmax 40vmax at 10% 5%,#7B5CFF44,transparent 70%),radial-gradient(35vmax 35vmax at 95% 30%,#FF4FA333,transparent 70%),#0b0816;background-attachment:fixed}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
#pg{padding:calc(env(safe-area-inset-top) + 8px) 0 150px;max-width:1000px;margin:0 auto}
/* en-tête */
.hdr{display:flex;align-items:center;gap:10px;padding:8px 16px 12px}
.hdr{align-items:flex-end}.hdr>div{flex:1;min-width:0}.hdr h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.025em}
.eyb{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.lcb{display:inline-flex;align-items:center;color:var(--acc);font-size:16px;font-weight:600;margin-bottom:6px;text-decoration:none}.lcb .i{width:18px;height:18px}
.me{width:44px;height:44px}
.me{width:36px;height:36px;border-radius:50%;background:var(--fill);color:var(--mut);display:grid;place-items:center;overflow:hidden;font-weight:700;font-size:14px;flex:none}
.me img{width:100%;height:100%;object-fit:cover}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--fill);color:var(--acc)}.ib .i{width:20px;height:20px}
.chips{display:flex;margin:0 16px 18px;padding:2px;border-radius:10px;background:var(--fill)}

.chip[aria-pressed=true]{background:var(--card);opacity:1;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.recents{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding:16px}
.recents::-webkit-scrollbar{display:none}
.rc{flex:none;width:118px;text-align:left;font-size:13px;font-weight:500;scroll-snap-align:start}

.rc>span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}

.det>.cv.r{width:min(44vw,170px)}

.cv.r{border-radius:50%}
.cv.e{background:linear-gradient(160deg,var(--ph1),var(--ph2));color:var(--phi);display:grid;place-items:center}.cv.e>.i{width:36%;height:36%;stroke-width:1.6}.cv.e>b{font-size:42px;font-weight:600}

.li{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;text-align:left;border-bottom:.5px solid var(--line)}

.acts button:first-child{background:var(--acc);color:var(--onacc)}
.acts .i{width:18px;height:18px}
.emp{color:var(--mut);text-align:center;padding:36px 30px;line-height:1.5}
/* recherche */
.sbox{margin:0 16px 4px;display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:10px 12px;color:var(--mut)}
.sbox .i{width:20px;height:20px}
.sbox input{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;outline:none;min-width:0}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
@media(min-width:700px){.cats{grid-template-columns:repeat(4,1fr)}}
.cat{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px;text-align:left;font-weight:600;font-size:15px}
.cat i{width:36px;height:36px;border-radius:10px;background:var(--accs);color:var(--acc);display:grid;place-items:center;flex:none}.cat i .i{width:20px;height:20px}
/* barre du bas + mini-lecteur (verre dépoli) */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:0 16px max(6px,calc(env(safe-area-inset-bottom) - 18px));pointer-events:none}
.tbw{display:flex;gap:10px;max-width:560px;margin:0 auto}
#mini,#tabs,#srB{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(2);backdrop-filter:blur(30px) saturate(2);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.12)}
#mini{position:relative;display:flex;align-items:center;gap:10px;border-radius:30px;padding:8px 14px 8px 8px;margin-bottom:10px;overflow:hidden}
#mini .cv,#mini .ph{width:42px;border-radius:10px}
#mini .ph{aspect-ratio:1;flex:none;background:linear-gradient(160deg,var(--ph1),var(--ph2));display:grid;place-items:center;color:var(--phi)}#mini .ph .i{width:18px}

#mini .c{padding:7px;display:grid}#mini .c .i{width:24px;height:24px}
#mini .pg{position:absolute;left:24px;right:24px;bottom:0;height:2px;border-radius:2px;background:var(--line)}#mini .pg i{display:block;height:100%;background:var(--acc);width:0;border-radius:2px}

#tabs button{flex:1;border-radius:29px;transition:background .25s,color .25s}

#np{position:fixed;inset:0;z-index:80;color:#fff;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 24px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(#3d3222,#100e0b 72%)}

.nh{display:flex;align-items:center;gap:10px;text-align:center}
.nh>span{flex:1;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}.nh>span b{display:block;font-size:13px;text-transform:none;letter-spacing:0;opacity:1;margin-top:2px;color:#fff}

.nt{display:flex;align-items:center;gap:12px}.nt>span{flex:1;min-width:0}
.nt b{display:block;font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nt small{display:block;font-size:15px;opacity:.65;margin-top:2px}

.nc .pp{width:66px;height:66px;border-radius:50%;background:#fff;color:#121214;display:grid;place-items:center}.nc .pp .i{width:28px;height:28px}
.nf{display:flex;justify-content:space-between;opacity:.75}.nf .i{width:20px;height:20px}.nf>span{display:flex;gap:24px}
/* feuilles d'actions, toast, compte */
#sh{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
